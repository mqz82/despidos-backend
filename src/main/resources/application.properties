# ==========================================
# CONFIGURACIÓN GENERAL
# ==========================================
spring.application.name=despidos-backend
server.port=8080

# CORS - permitir frontend Angular
spring.mvc.cors.allowed-origins=http://localhost:4200
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*

# ==========================================
# BASE DE DATOS (H2 para desarrollo)
# ==========================================
spring.datasource.url=jdbc:h2:mem:despidosdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# CONFIGURACIÓN PARA PRODUCCIÓN (PostgreSQL)
# Descomentar y configurar para producción
# ==========================================
# spring.datasource.url=jdbc:postgresql://localhost:5432/despidosdb
# spring.datasource.username=postgres
# spring.datasource.password=TU_PASSWORD
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# EMAIL (alertas)
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=TU_EMAIL@gmail.com
spring.mail.password=TU_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================
# ALERTAS - CONFIGURACIÓN POR DEFECTO
# ==========================================
# Días de anticipación para alertar antes del juicio
alertas.dias-anticipacion=30
# Email destinatario de alertas
alertas.email-destino=legal@empresa.com
# Hora de ejecución del job de alertas (cron: seg min hora día mes díaSemana)
alertas.cron=0 0 8 * * MON-FRI

# ==========================================
# LOGGING
# ==========================================
logging.level.com.despidos=INFO
logging.level.org.springframework.web=WARN

# ==========================================
# L�mite de subida de archivos
# ==========================================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ==========================================
# # Carpeta para archivos f�sicos
# ==========================================
archivos.upload-dir=C:/Users/sm_ma/Documents
